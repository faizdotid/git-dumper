name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          if go test -race -count=1 ./... 2>&1 | tee go-test.log; then
            exit 0
          fi
          # surface the failing tests as check-run annotations, so failures are
          # diagnosable without downloading the job log
          grep -E "^(--- FAIL|FAIL|panic:)" go-test.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          if go test -count=1 ./... 2>&1 | tee go-test.log; then
            exit 0
          fi
          grep -E "^(--- FAIL|FAIL|panic:)" go-test.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Build
        run: go build ./...
